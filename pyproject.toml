[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adb-ngo-scraper"
version = "0.1.0"
description = "Scrapes ADB's Consultant Management System (cms.adb.org) for NGO-suitable project consulting notices and stores them in SQLite"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
adb-ngo-scraper = "adb_ngo_scraper.main:main"

[tool.setuptools.packages.find]
where = ["src"]
